<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenportal - Unsolved Physics Fun</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true,
            processEnvironments: true
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">Unsolved Physics Fun</div>
            <nav class="nav-menu">
                <a href="/">Kurse</a>
                <a href="/blog">Blog</a>
                <a href="/jobs">Jobs</a>
                <a href="/data">Datenportal</a>
                <button class="nav-button">Login</button>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>Physik Datenportal</h1>
        <p>Finde sofort genau die richtige und ähnliche Übungen und Klausuren</p>
    </section>

    <div id="search-filters">
        <input type="text" id="search" placeholder="Suche nach Themen...">
        
        <select id="fachgebiet">
            <option value="">Fachgebiet</option>
            <option value="Elektrodynamik">Elektrodynamik</option>
            <option value="Mechanik">Mechanik</option>
            <option value="Optik">Optik</option>
            <option value="Hydrodynamik">Hydrodynamik</option>
            <option value="Thermodynamik">Thermodynamik</option>
            <option value="Atom- und Molekülphysik">Atom- und Molekülphysik</option>
            <option value="Festkörperphysik">Festkörperphysik</option>
            <option value="Quantenmechanik">Quantenmechanik</option>
            <option value="Relativitätstheorie">Relativitätstheorie</option>
        </select>

        <select id="teilbereich">
            <option value="">Teilbereich</option>
            <option value="Experimental">Experimental</option>
            <option value="Theoretisch">Theoretisch</option>
        </select>

        <select id="art">
            <option value="">Art</option>
            <option value="Klausur">Klausur</option>
            <option value="Übung">Übung</option>
            <option value="Last-Minute">Last-Minute</option>
        </select>

    </div>

    <section class="grid-container">
        <!-- Dynamisch geladener Inhalt -->
    </section>

    <script src="apps.js"></script>
</body>
</html>
