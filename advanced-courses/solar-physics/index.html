<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formelsuche</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <h1>Formelsuche</h1>
        <p>Geben Sie eine Formel ein oder verwenden Sie die Platzhalter unten.</p>
    </header>
    <main>
        <section id="search-container">
            <div id="search-bar">
                <input type="text" id="search-input" placeholder="Formel eingeben..." autocomplete="off">
                <button id="search-button">🔍</button>
            </div>
            <div id="placeholders">
                <button class="placeholder" data-value="x^2">x²</button>
                <button class="placeholder" data-value="√x">√x</button>
                <button class="placeholder" data-value="∫">∫</button>
                <button class="placeholder" data-value="∂">∂</button>
                <button class="placeholder" data-value="Σ">Σ</button>
                <button class="placeholder" data-value="∞">∞</button>
                <button class="placeholder" data-value="lim">lim</button>
                <button class="placeholder" data-value="∑">∑</button>
                <button class="placeholder" data-value="π">π</button>
                <button class="placeholder" data-value="e^x">e^x</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Formelsuche. Alle Rechte vorbehalten.</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
